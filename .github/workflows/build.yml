name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.x'
  GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Resolve modules
        working-directory: core
        run: go mod tidy
      - name: Vet and test
        working-directory: core
        run: |
          go vet ./...
          go test -ldflags=-checklinkname=0 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-modules
          path: |
            core/go.mod
            core/go.sum

  ios:
    needs: core
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Restore Go framework
        id: framework
        uses: actions/cache@v4
        with:
          path: apple/Frameworks/PDCore.xcframework
          key: pdcore-${{ runner.os }}-${{ env.GOMOBILE_VERSION }}-${{ hashFiles('core/**') }}
      - name: Resolve modules
        if: steps.framework.outputs.cache-hit != 'true'
        working-directory: core
        run: go mod tidy
      - name: Build IPA
        run: scripts/build-ios.sh "${{ github.run_number }}"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Paradise-ipa
          path: |
            build/*.ipa
            build/*.sha256
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="$(cat build/ipa-path.txt)"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/DerivedData/Build/Products/Release-iphoneos/Paradise.app/Info.plist)
          TAG="v$VERSION"
          # One prerelease per version, always pointing at the latest successful build.
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" "$IPA" "$IPA.sha256" --target "$GITHUB_SHA" \
            --title "Paradise $VERSION (build ${{ github.run_number }})" --prerelease \
            --notes-file docs/RELEASE.md
