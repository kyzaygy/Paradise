name: ui

# Core tests, simulator screenshots of the demo scenarios and UI tests.
# The report is pushed to the ci-screens branch (see scripts/publish-report.sh).
on:
  push:
    branches-ignore: [ci-screens]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.x'
  GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Resolve modules
        working-directory: core
        run: go mod tidy
      - name: Vet and test (including protocol end-to-end tests)
        working-directory: core
        run: |
          go vet ./...
          if ! go test -count=1 -ldflags=-checklinkname=0 ./... > ../test.log 2>&1; then
            cat ../test.log
            echo "::error title=core tests::$(grep -E -B2 -A12 -- '--- FAIL|^panic:|^FAIL|build failed|cannot use|undefined:' ../test.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat ../test.log
          echo "::notice title=core tests::$(grep -E '^(ok|---|PASS|FAIL)' ../test.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - name: Protocol end-to-end results
        working-directory: core
        run: |
          go test -count=1 -ldflags=-checklinkname=0 -v -run 'TestEndToEndProtocols|TestSimpleConfAcceptedByXray|AcceptedByXray' ./pdcore/ > ../e2e.log 2>&1 || true
          echo "::notice title=protocol tests::$(grep -E -- '--- (PASS|FAIL)' ../e2e.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  simulator:
    runs-on: macos-26-intel
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Restore simulator framework
        id: framework
        uses: actions/cache@v4
        with:
          path: apple/Frameworks/PDCore.xcframework
          key: pdcore-sim-${{ runner.os }}-${{ env.GOMOBILE_VERSION }}-${{ hashFiles('core/**') }}
      - name: Build Go core for the simulator
        if: steps.framework.outputs.cache-hit != 'true'
        working-directory: core
        run: |
          go mod tidy
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
          gomobile init
          gomobile bind -target=iossimulator/amd64 -iosversion=16.0 -trimpath \
            -ldflags='-checklinkname=0 -s -w' -o ../apple/Frameworks/PDCore.xcframework ./pdcore
      - name: Build for the simulator
        timeout-minutes: 35
        run: scripts/ui-check.sh build
      - name: Screenshots
        timeout-minutes: 25
        run: scripts/ui-check.sh shots
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-report.sh
      - name: UI tests
        timeout-minutes: 40
        run: scripts/ui-check.sh tests
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-report.sh
