name: Paradise
options:
  bundleIdPrefix: com.kyzaygy
  developmentLanguage: en
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGNING_REQUIRED: 'NO'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_BITCODE: 'NO'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    OTHER_LDFLAGS: ['$(inherited)', '-ObjC', '-lresolv']
    DEAD_CODE_STRIPPING: 'YES'
targets:
  Paradise:
    type: application
    platform: iOS
    sources:
      - path: Paradise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyzaygy.paradise
        PRODUCT_NAME: Paradise
        SWIFT_OBJC_BRIDGING_HEADER: Paradise/Paradise-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/Paradise-Info.plist
      properties:
        CFBundleDisplayName: Paradise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: The camera is used to scan QR codes of subscriptions and profiles.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kyzaygy.paradise.import
            CFBundleURLSchemes: [paradise]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.kyzaygy.paradise.profile
            UTTypeDescription: Paradise profile
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [paradise]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: space.svoi.profile
            UTTypeDescription: SVOI profile
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [svoi]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Paradise profile
            LSHandlerRank: Owner
            LSItemContentTypes: [com.kyzaygy.paradise.profile]
          - CFBundleTypeName: SVOI profile
            LSHandlerRank: Alternate
            LSItemContentTypes: [space.svoi.profile]
    entitlements:
      path: Support/Paradise.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Frameworks/PDCore.xcframework
        embed: false
      - target: PacketTunnel
        embed: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyzaygy.paradise.tunnel
        PRODUCT_NAME: PacketTunnel
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    info:
      path: Support/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: Paradise Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Support/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Frameworks/PDCore.xcframework
        embed: false
schemes:
  Paradise:
    build:
      targets:
        Paradise: all
        PacketTunnel: all
